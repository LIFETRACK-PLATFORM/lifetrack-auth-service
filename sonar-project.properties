# SonarQube project configuration
sonar.projectKey=lifetrack-auth-service
sonar.projectName=lifetrack-auth-service
sonar.projectVersion=0.0.1

# Sources and tests
sonar.sources=src
sonar.tests=test
sonar.test.inclusions=**/*.spec.ts
sonar.inclusions=**/*.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/generated/**,**/*.spec.ts
sonar.coverage.exclusions=**/*.spec.ts,**/*.module.ts,**/main.ts

# Language-specific properties
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# SonarQube server (override con SONAR_HOST_URL en .env.sonar)
sonar.host.url=http://localhost:9000
# Autenticacion: define SONAR_TOKEN en .env.sonar (no commitees el token).
