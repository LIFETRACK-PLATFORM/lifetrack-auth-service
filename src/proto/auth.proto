syntax = "proto3";

package lifetrack.auth;

service AuthService {
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc Refresh (RefreshRequest) returns (LoginResponse);
  rpc Logout (LogoutRequest) returns (LogoutResponse);
  rpc ValidateToken (ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc Me (MeRequest) returns (MeResponse);
  rpc ForgotPassword (ForgotPasswordRequest) returns (ForgotPasswordResponse);
  rpc ResetPassword (ResetPasswordRequest) returns (ResetPasswordResponse);
  rpc ConfirmEmail (ConfirmEmailRequest) returns (ConfirmEmailResponse);
  rpc ResendVerification (ResendVerificationRequest) returns (ResendVerificationResponse);
  rpc LoginWithOAuth (LoginWithOAuthRequest) returns (LoginWithOAuthResponse);
  rpc LinkOAuthAccount (LinkOAuthAccountRequest) returns (LoginResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string displayName = 3;
  repeated string roles = 4;
}

message RegisterResponse {
  string credentialId = 1;
  string userId = 2;
  string email = 3;
  repeated string roles = 4;
  string status = 5;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string accessToken = 1;
  string refreshToken = 2;
  string userId = 3;
  string email = 4;
  repeated string roles = 5;
  string status = 6;
}

message RefreshRequest {
  string refreshToken = 1;
}

message LogoutRequest {
  string refreshToken = 1;
}

message LogoutResponse {
  bool success = 1;
}

message ValidateTokenRequest {
  string accessToken = 1;
}

message ValidateTokenResponse {
  string sub = 1;
  string email = 2;
  repeated string roles = 3;
}

message MeRequest {
  string refreshToken = 1;
}

message MeResponse {
  string userId = 1;
  string email = 2;
  repeated string roles = 3;
  string status = 4;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ForgotPasswordResponse {
  bool success = 1;
}

message ResetPasswordRequest {
  string token = 1;
  string newPassword = 2;
}

message ResetPasswordResponse {
  bool success = 1;
}

message ConfirmEmailRequest {
  string token = 1;
}

message ConfirmEmailResponse {
  bool success = 1;
}

message ResendVerificationRequest {
  string email = 1;
}

message ResendVerificationResponse {
  bool success = 1;
}

message LoginWithOAuthRequest {
  string provider = 1;
  string code = 2;
  string codeVerifier = 3;
}

message LoginWithOAuthResponse {
  string status = 1;
  string accessToken = 2;
  string refreshToken = 3;
  string userId = 4;
  string email = 5;
  repeated string roles = 6;
  string credentialStatus = 7;
  string linkToken = 8;
  string provider = 9;
}

message LinkOAuthAccountRequest {
  string provider = 1;
  string linkToken = 2;
  string password = 3;
}
